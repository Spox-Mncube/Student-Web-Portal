<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assessor Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="glow-card">
      <div class="glow-inner">

        <div class="text-center">
          <span class="badge-role assessor">Learner</span>
        </div>

        <div class="form-title">
          <i class="fa-solid fa-user-shield icon-purple"></i> Learner LOGIN
        </div>

        <form onsubmit="LearnerLogin(event)">

          <div class="input-group">
            <i class="fa-regular fa-user"></i>
            <input id="as_user" placeholder="Enter Email" value="" required>
          </div>

          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input id="as_pass" type="password" placeholder="Enter Password" value="" required>

          </div>

          <div id="as_err" class="error"></div>
          <div id="as_ok" class="success"></div>

          <button class="btn-glow" type="submit">Sign In as Learner</button>

          <div class="form-links">
            <a href="./assesor-login.html">Assessor Login?</a>
            <a href="./signUp.html">Create Learner</a>
          </div>

        </form>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
